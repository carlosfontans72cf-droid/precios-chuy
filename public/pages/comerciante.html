<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del Comerciante - Precios Chuy</title>
  <link rel="stylesheet" href="/css/styles.css">
  <meta name="theme-color" content="#0038A8">
  <style>
    .perfil-header { background: linear-gradient(135deg, #0038A8, #009C3B); color: white; padding: 30px 20px; text-align: center; border-radius: 0 0 20px 20px; margin-bottom: 20px; }
    .perfil-foto { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #FFDF00; margin-bottom: 15px; }
    .perfil-foto-placeholder { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #FFDF00, #FFC107); display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 15px auto; border: 4px solid white; }
    .perfil-nombre { font-size: 1.8rem; font-weight: bold; margin: 0 0 5px 0; }
    .perfil-tipo { font-size: 1rem; opacity: 0.9; margin: 0; }
    .info-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .info-card h3 { color: #0038A8; margin: 0 0 15px 0; border-bottom: 2px solid #FFDF00; padding-bottom: 8px; }
    .info-row { display: flex; align-items: flex-start; margin-bottom: 12px; gap: 10px; }
    .info-row .icono { font-size: 1.3rem; min-width: 24px; }
    .info-row .texto { flex: 1; }
    .info-row .label { font-size: 0.85rem; color: #666; margin-bottom: 2px; }
    .info-row .valor { font-size: 1rem; color: #333; font-weight: 500; }
    .cambio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .cambio-item { background: #f8f9fa; padding: 12px; border-radius: 8px; text-align: center; }
    .cambio-item .moneda { font-size: 0.8rem; color: #666; margin-bottom: 4px; }
    .cambio-item .valor { font-size: 1.3rem; font-weight: bold; color: #0038A8; }
    .producto-card { background: white; border-radius: 12px; overflow: hidden; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .producto-img { width: 100%; height: 180px; object-fit: cover; background: #f0f0f0; }
    .producto-info { padding: 15px; }
    .producto-info h4 { margin: 0 0 10px 0; color: #333; }
    .precios { display: flex; justify-content: space-between; align-items: center; }
    .precio-br { color: #009C3B; font-weight: bold; font-size: 1.2rem; }
    .precio-uy { color: #0038A8; font-weight: bold; font-size: 1rem; }
    .badge-oferta { background: #FF6B00; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .btn-volver { position: fixed; top: 15px; left: 15px; z-index: 1000; background: white; color: #0038A8; border: 2px solid #0038A8; padding: 10px 20px; border-radius: 25px; font-weight: bold; text-decoration: none; }
    .btn-volver:hover { background: #0038A8; color: white; }
    .btn-whatsapp { display: inline-flex; align-items: center; gap: 8px; background: #25D366; color: white; padding: 12px 24px; border-radius: 25px; text-decoration: none; font-weight: bold; margin-top: 15px; }
    .loading, .error-msg { text-align: center; padding: 40px; }
    .loading { color: #666; }
    .error-msg { color: #dc3545; }
    .debug-box { background:#fff3cd; border:2px solid #ffc107; border-radius:8px; padding:15px; margin-bottom:15px; font-family:monospace; font-size:0.85rem; }
  </style>
</head>
<body>
  <a href="/pages/cliente.html" class="btn-volver">← Volver</a>
  <div id="contenido-perfil">
    <div class="loading"><div style="font-size:3rem;margin-bottom:15px;">⏳</div><p style="font-size:1.2rem;">Cargando TU panel...</p></div>
  </div>
  <script type="module">
    import { db } from '../js/firebase-config.js';
    import { doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ✅ BUSCA EL ID EN TODOS LOS NOMBRES POSIBLES
    const comercioId = 
      sessionStorage.getItem('userId') || 
      sessionStorage.getItem('userid') || 
      sessionStorage.getItem('UID') || 
      sessionStorage.getItem('uid') || 
      sessionStorage.getItem('usuarioId') || 
      sessionStorage.getItem('perfilComercioId') || 
      new URLSearchParams(window.location.search).get("id");

    const contenedor = document.getElementById('contenido-perfil');

    // ✅ DIAGNÓSTICO: MOSTRAR QUÉ SE ESTÁ LEYENDO
    const debugInfo = `
      <div class="debug-box">
        <strong>🔍 Diagnóstico:</strong><br>
        userId = ${sessionStorage.getItem('userId') || 'NO ENCONTRADO'}<br>
        userRole = ${sessionStorage.getItem('userRole') || 'NO ENCONTRADO'}<br>
        ID usado = ${comercioId || 'NINGUNO'}
      </div>
    `;

    if (!comercioId) {
      contenedor.innerHTML = `
        ${debugInfo}
        <div class="error-msg">
          <h2>Sesión no encontrada</h2>
          <p>El navegador no tiene acceso a tu sesión. Cierra todas las pestañas, vuelve a iniciar sesión y entra desde el botón de tu menú.</p>
          <a href="/index.html" style="color:#0038A8;font-weight:bold;">← Iniciar sesión</a>
        </div>
      `;
    } else {
      cargarPerfilCompleto(comercioId);
    }

    async function cargarPerfilCompleto(id) {
      try {
        const userDoc = await getDoc(doc(db, 'users', id));
        if (!userDoc.exists()) {
          contenedor.innerHTML = `
            ${debugInfo}
            <div class="error-msg">
              <h2>Comercio no encontrado en la base de datos</h2>
              <p>ID usado: ${id}</p>
              <a href="/pages/cliente.html" style="color:#0038A8;font-weight:bold;">← Volver</a>
            </div>
          `;
          return;
        }
        const data = userDoc.data();
        const nombre = data.nombreComercio || data.comercio || 'Comercio';
        const tipo = data.tipo || 'comercio';
        const direccion = data.direccion || 'No disponible';
        const telefono = data.telefono || '';
        const horarios = data.horarios || 'No disponible';
        const logo = data.logo || '';
        const lat = data.lat;
        const lng = data.lng;
        const iconos = { supermercado: '', carniceria: '🥩', farmacia: '💊', bebidas: '', ropa: '👕', electronica: '📱', panaderia: '', ferreteria: '', otro: '' };
        const icono = iconos[tipo] || '';
        let html = debugInfo + '<div class="perfil-header">';
        if (logo) {
          html += '<img src="' + logo + '" alt="' + nombre + '" class="perfil-foto" onerror="this.style.display=\'none\'">';
        } else {
          html += '<div class="perfil-foto-placeholder">' + icono + '</div>';
        }
        html += '<h1 class="perfil-nombre">' + icono + ' ' + nombre + '</h1>';
        html += '<p class="perfil-tipo">✅ TU PANEL PRIVADO</p>';
        if (telefono) {
          html += '<a href="https://wa.me/' + telefono.replace(/[^0-9]/g, '') + '" target="_blank" class="btn-whatsapp">💬 WhatsApp</a>';
        }
        html += '</div><div class="container">';
        html += '<div class="info-card"><h3>📍 Información</h3>';
        html += '<div class="info-row"><span class="icono">🏠</span><div class="texto"><div class="label">Dirección</div><div class="valor">' + direccion + '</div></div></div>';
        html += '<div class="info-row"><span class="icono">📞</span><div class="texto"><div class="label">Teléfono</div><div class="valor">' + (telefono || 'No disponible') + '</div></div></div>';
        html += '<div class="info-row"><span class="icono">🕐</span><div class="texto"><div class="label">Horarios</div><div class="valor">' + horarios + '</div></div></div>';
        html += '</div>';
        if (data.cambioUsdCompra || data.cambioUsdVenta || data.cambioBrlCompra || data.cambioBrlVenta) {
          html += '<div class="info-card"><h3>💱 Cotizaciones</h3><div class="cambio-grid">';
          if (data.cambioUsdCompra) html += '<div class="cambio-item"><div class="moneda">Compra USD</div><div class="valor">$' + data.cambioUsdCompra.toFixed(2) + '</div></div>';
          if (data.cambioUsdVenta) html += '<div class="cambio-item"><div class="moneda">Venta USD</div><div class="valor">$' + data.cambioUsdVenta.toFixed(2) + '</div></div>';
          if (data.cambioBrlCompra) html += '<div class="cambio-item"><div class="moneda">Compra Real</div><div class="valor">R$' + data.cambioBrlCompra.toFixed(2) + '</div></div>';
          if (data.cambioBrlVenta) html += '<div class="cambio-item"><div class="moneda">Venta Real</div><div class="valor">R$' + data.cambioBrlVenta.toFixed(2) + '</div></div>';
          html += '</div></div>';
        }
        if (lat && lng) {
          html += '<div class="info-card"><h3>🗺️ Ubicación</h3>';
          html += '<p>Lat: ' + lat.toFixed(6) + ' | Lng: ' + lng.toFixed(6) + '</p>';
          html += '<a href="https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng + '" target="_blank" style="display:inline-block;padding:10px 20px;background:#0038A8;color:white;border-radius:25px;text-decoration:none;font-weight:bold;margin-top:10px;">📍 Abrir en Google Maps</a>';
          html += '</div>';
        } else {
          html += '<div class="info-card"><h3>🗺️ Ubicación</h3><p style="color:#666;">Ubicación no disponible</p></div>';
        }
        html += '<div class="info-card"><h3>🛒 Tus Productos</h3><div id="lista-productos-comercio"><div class="loading">Cargando productos...</div></div></div></div>';
        contenedor.innerHTML = html;
        try {
          const productosQuery = query(collection(db, 'productos'), where('comercioId', '==', id));
          const productosSnap = await getDocs(productosQuery);
          const contProductos = document.getElementById('lista-productos-comercio');
          if (productosSnap.empty) {
            contProductos.innerHTML += '<p style="text-align:center;color:#666;padding:20px;">Sin productos cargados.</p>';
          } else {
            contProductos.innerHTML += '';
            productosSnap.forEach(function(d) {
              const prod = d.data();
              if (prod.suspendido) return;
              const imgHtml = prod.imagen ? '<img src="' + prod.imagen + '" alt="' + prod.nombre + '" class="producto-img" onerror="this.style.display=\'none\'">' : '<div class="producto-img" style="display:flex;align-items:center;justify-content:center;font-size:3rem;background:#f0f0f0;">📷</div>';
              const ofertaBadge = prod.esOferta ? '<span class="badge-oferta">🔥 OFERTA</span>' : '';
              const precioUy = prod.precioUruguay ? '<span class="precio-uy">$U ' + prod.precioUruguay + '</span>' : '';
              const div = document.createElement('div');
              div.className = 'producto-card';
              div.innerHTML = imgHtml + '<div class="producto-info"><h4>' + prod.nombre + ' ' + ofertaBadge + '</h4><div class="precios"><span class="precio-br">R$ ' + prod.precioBrasil + '</span>' + precioUy + '</div></div>';
              contProductos.appendChild(div);
            });
          }
        } catch (err) {
          console.error('Error productos:', err);
          document.getElementById('lista-productos-comercio').innerHTML += '<p style="color:red;">Error al cargar productos</p>';
        }
      } catch (err) {
        console.error('Error:', err);
        contenedor.innerHTML = `
          ${debugInfo}
          <div class="error-msg">
            <h2>Error al cargar</h2>
            <p>${err.message}</p>
            <a href="/pages/cliente.html" style="color:#0038A8;font-weight:bold;">← Volver</a>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
